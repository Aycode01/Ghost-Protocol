name: Contributor check

# Rejects pull requests whose commits or description credit an AI tool
# (Claude, ChatGPT, Copilot, etc.) as a co-author or generator. Only the
# eight team members are credited in this repository.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  no-ai-coauthors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages and authors
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='(co-authored-by:.*(claude|anthropic|chatgpt|openai|gpt-|copilot|gemini|codeium|cursor|devin))|generated with \[?(claude|chatgpt|copilot)|noreply@anthropic\.com|noreply@openai\.com'
          bad=$(git log --format='%H%n%an <%ae>%n%B%n----' "$BASE..$HEAD" | grep -inE "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "::error::A commit in this pull request credits an AI tool as an author or co-author."
            echo "$bad"
            echo
            echo "Fix: rewrite the commit message without that line, e.g."
            echo "  git rebase -i $BASE   (reword the commit)  then  git push --force-with-lease"
            exit 1
          fi
          echo "No AI co-author lines found in commits."

      - name: Check pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -iqE 'generated with \[?(claude|chatgpt|copilot)|co-authored-by:.*(claude|chatgpt|openai|anthropic|copilot)'; then
            echo "::error::The pull request description credits an AI tool. Remove that line and save the description."
            exit 1
          fi
          echo "Pull request description is clean."
